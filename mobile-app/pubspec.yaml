name: fripay_app
description: "FriPay — application mobile de paiement (Bénin). Portage fidèle du web (benin-money-hub) en Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  fl_chart: ^0.69.0
  local_auth: ^2.3.0
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^22.3.0
  # Répertoire téléphonique natif (cahier des charges §5 : ajout de contact
  # depuis les contacts de l'appareil).
  flutter_contacts: ^1.1.9+2
  http: ^1.2.2
  # Sauvegarde d'images dans la galerie (téléchargement du QR généré).
  gal: ^2.3.0
  # Recomposition d'images (retry de décodage des QR téléversés).
  image: ^4.2.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#16332A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FAF9F4"
    theme_color: "#1E7A5C"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/images/
